name: V4 regime lane audit
on:
  pull_request:
    paths:
      - 'v4_regime_lane_audit.py'
      - 'test_v4_regime_lane_audit.py'
      - '.github/workflows/v4-regime-lane-audit.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated regime lane regression tests
        run: python -m unittest -v test_v4_regime_lane_audit.py
