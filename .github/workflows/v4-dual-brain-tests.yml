name: V4 two-brain validation

on:
  push:
    branches:
      - feature/v4-dual-brain-ten-20261110
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Execute V4 tests
        run: python -m unittest discover -p 'test_v*.py' -v
