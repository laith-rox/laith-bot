name: V4 follow-through safety tests

on:
  push:
    branches:
      - feature/v4-opportunity-21-23-26-20261111
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Regression tests
        run: python -m unittest discover -p 'test_v*.py' -v
