name: GIGI Gold Brain Tests

on:
  push:
    branches: [gigi-gold-brain-v1, gigi-market-fallback-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile gigi_gold_brain.py gold_intelligence.py live_api.py
      - run: python -m unittest -v test_gigi_gold_brain.py
