name: V4 adaptive 11-20 tests

on:
  push:
    branches:
      - feature/v4-adaptive-11-20-20261111
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run V4 regression suite
        run: python -m unittest discover -p 'test_v*.py' -v
