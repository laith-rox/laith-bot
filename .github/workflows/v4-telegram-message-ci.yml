name: V4 decision and message regression
on:
  pull_request:
    branches: [v4-main]
    paths:
      - 'v4_telegram.py'
      - 'v4_intelligence.py'
      - 'v4_schedule.py'
      - 'test_v4_schedule.py'
      - 'v4_service.py'
      - 'v4_runtime.py'
      - 'test_v4_intelligence.py'
      - 'test_v4_continuation_side.py'
      - '.github/workflows/v4-telegram-message-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_v4*.py'
