name: V4 compact emergency
on:
  pull_request:
    paths:
      - 'safety_monitor.py'
      - 'test_v4_compact_emergency.py'
      - '.github/workflows/v4-compact-emergency.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_v4_compact_emergency.py
      - run: python -m py_compile safety_monitor.py
